<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>CRAZY-JEW 3D</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      cursor: pointer;
      user-select: none;
    }
    #gate {
      display: none;
      min-height: 100%;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      font-size: 1.25rem;
      font-weight: 700;
    }
    #gate.show { display: flex; }
  </style>
  <script>
    (function () {
      var gameUrl = new URL("play.html", location.href).href;

      function writeGame(win) {
        var html =
          "<!DOCTYPE html><html><head><meta charset=\"utf-8\">" +
          "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">" +
          "<title>CRAZY-JEW 3D</title>" +
          "<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}" +
          "iframe{border:0;width:100%;height:100%;display:block}</style></head><body>" +
          "<iframe src=\"" + gameUrl + "\" allow=\"autoplay; fullscreen; gamepad; keyboard-map\" allowfullscreen></iframe>" +
          "</body></html>";
        win.document.open();
        win.document.write(html);
        win.document.close();
      }

      function openBlank() {
        var w = window.open("about:blank", "_blank");
        if (!w) return false;
        writeGame(w);
        return true;
      }

      // Run immediately during parse (best chance of beating the popup blocker
      // when this page was opened by a click / start-server).
      if (openBlank()) {
        // Leave this tab empty so only about:blank remains useful.
        try { window.stop(); } catch (e) {}
        document.write("<html><head><title></title></head><body bgcolor=\"#000\"></body></html>");
        document.close();
      } else {
        window.__needClick = true;
      }
    })();
  </script>
</head>
<body>
  <div id="gate">Click to open</div>
  <script>
    (function () {
      if (!window.__needClick) return;
      var gate = document.getElementById("gate");
      gate.className = "show";
      function go() {
        var gameUrl = new URL("play.html", location.href).href;
        var w = window.open("about:blank", "_blank");
        if (!w) {
          location.href = gameUrl;
          return;
        }
        w.document.open();
        w.document.write(
          "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>CRAZY-JEW 3D</title>" +
          "<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}" +
          "iframe{border:0;width:100%;height:100%;display:block}</style></head><body>" +
          "<iframe src=\"" + gameUrl + "\" allow=\"autoplay; fullscreen; gamepad; keyboard-map\" allowfullscreen></iframe>" +
          "</body></html>"
        );
        w.document.close();
        document.body.innerHTML = "";
        document.body.style.background = "#000";
      }
      gate.addEventListener("click", go);
      document.addEventListener("click", go, { once: true });
      document.addEventListener("keydown", go, { once: true });
    })();
  </script>
</body>
</html>
