<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>CRAZY-JEW 3D</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      cursor: pointer;
      user-select: none;
    }
    #boot {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0;
    }
    p {
      margin: 0;
      opacity: 0.75;
      max-width: 28rem;
      line-height: 1.4;
    }
    #go {
      margin-top: 0.5rem;
      border: 0;
      background: #fff;
      color: #000;
      font: inherit;
      font-weight: 700;
      padding: 0.85rem 1.6rem;
      cursor: pointer;
    }
    #go:hover { background: #e8e8e8; }
    #status { min-height: 1.25rem; opacity: 0.6; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="boot">
    <h1>CRAZY-JEW 3D</h1>
    <p>Opens the game in an <code>about:blank</code> tab.</p>
    <button type="button" id="go">Click to play</button>
    <div id="status"></div>
  </div>
  <script>
    (function () {
      var gameUrl = new URL("play.html", location.href).href;
      var statusEl = document.getElementById("status");

      function openInAboutBlank() {
        var w = window.open("about:blank", "_blank");
        if (!w) {
          statusEl.textContent = "Pop-up blocked — allow pop-ups for this site, then click again.";
          return false;
        }
        var html =
          "<!DOCTYPE html><html><head><meta charset=\"utf-8\">" +
          "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">" +
          "<title>CRAZY-JEW 3D</title>" +
          "<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}" +
          "iframe{border:0;width:100%;height:100%;display:block}</style></head><body>" +
          "<iframe src=\"" + gameUrl + "\" allow=\"autoplay; fullscreen; gamepad; keyboard-map\" allowfullscreen></iframe>" +
          "</body></html>";
        w.document.open();
        w.document.write(html);
        w.document.close();
        statusEl.textContent = "Opened in about:blank — you can close this tab.";
        return true;
      }

      document.getElementById("go").addEventListener("click", openInAboutBlank);
      document.getElementById("boot").addEventListener("click", function (e) {
        if (e.target.id === "go") return;
        openInAboutBlank();
      });

      // Auto-try on load (works when the browser allows it; otherwise click once).
      try { openInAboutBlank(); } catch (err) {}
    })();
  </script>
</body>
</html>
